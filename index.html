<!DOCTYPE html>
<html lang="en" class="h-full dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude Code Kanban</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23CC785C'/><text x='50' y='72' font-family='Georgia,serif' font-size='68' font-weight='bold' fill='white' text-anchor='middle'>C</text></svg>" />
  <script>tailwind = { darkMode: 'class' }</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link id="hljs-dark"  rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css" />
  <link id="hljs-light" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github.min.css" disabled />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
  <style>
    /* Light prose */
    .prose h1 { font-size:1.5rem; font-weight:700; margin:1rem 0 0.5rem; color:#1e293b; }
    .prose h2 { font-size:1.25rem; font-weight:700; margin:1rem 0 0.5rem; color:#1e293b; border-bottom:1px solid #e2e8f0; padding-bottom:0.25rem; }
    .prose h3 { font-size:1.1rem; font-weight:600; margin:0.75rem 0 0.25rem; color:#334155; }
    .prose p  { margin:0.5rem 0; color:#475569; line-height:1.6; }
    .prose ul { list-style-type:disc; padding-left:1.5rem; margin:0.5rem 0; color:#475569; }
    .prose ol { list-style-type:decimal; padding-left:1.5rem; margin:0.5rem 0; color:#475569; }
    .prose li { margin:0.2rem 0; }
    .prose code { background:#f1f5f9; color:#6d28d9; padding:0.1rem 0.3rem; border-radius:0.25rem; font-size:0.875rem; font-family:monospace; }
    .prose pre  { margin:0.75rem 0; border-radius:0.5rem; overflow:auto; }
    .prose pre code { background:transparent; padding:0; color:inherit; }
    .prose table { width:100%; border-collapse:collapse; margin:0.75rem 0; font-size:0.875rem; }
    .prose th { background:#f8fafc; color:#64748b; font-weight:600; padding:0.4rem 0.75rem; text-align:left; border:1px solid #e2e8f0; }
    .prose td { color:#475569; padding:0.4rem 0.75rem; border:1px solid #e2e8f0; }
    .prose blockquote { border-left:3px solid #cbd5e1; padding-left:1rem; color:#64748b; margin:0.5rem 0; }
    .prose a  { color:#6d28d9; text-decoration:underline; }
    .prose hr { border-color:#e2e8f0; margin:1rem 0; }

    /* Dark prose */
    .dark .prose h1 { color:#f1f5f9; }
    .dark .prose h2 { color:#f1f5f9; border-bottom-color:#334155; }
    .dark .prose h3 { color:#e2e8f0; }
    .dark .prose p  { color:#cbd5e1; }
    .dark .prose ul { color:#cbd5e1; }
    .dark .prose ol { color:#cbd5e1; }
    .dark .prose code { background:#1e293b; color:#93c5fd; }
    .dark .prose th { background:#1e293b; color:#94a3b8; border-color:#334155; }
    .dark .prose td { color:#cbd5e1; border-color:#334155; }
    .dark .prose blockquote { border-left-color:#475569; color:#94a3b8; }
    .dark .prose a  { color:#60a5fa; }
    .dark .prose hr { border-color:#334155; }

    .card { cursor:grab; }
    .card:active { cursor:grabbing; }
    .drag-over { outline:2px dashed #60a5fa; outline-offset:-2px; }
    .dragging { opacity:0.4; }
    .col-drop-target { min-height:2rem; }
  </style>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 flex flex-col overflow-hidden transition-colors duration-150">

  <!-- Header -->
  <header class="flex items-center justify-between px-6 py-4 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 shrink-0">
    <div class="flex items-center gap-3">
      <svg class="w-6 h-6 text-violet-500 dark:text-violet-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
      </svg>
      <h1 class="text-lg font-semibold tracking-tight">Claude Code Kanban</h1>
    </div>
    <button id="theme-toggle" onclick="toggleTheme()"
      class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium border
             text-slate-500 hover:text-slate-700 hover:bg-slate-100 border-slate-200
             dark:text-slate-400 dark:hover:text-slate-200 dark:hover:bg-slate-700 dark:border-slate-700
             transition-colors">
      <svg id="icon-sun" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M17.657 17.657l-.707-.707M6.343 6.343l-.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z" />
      </svg>
      <svg id="icon-moon" class="w-4 h-4 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
      </svg>
      <span id="theme-label">Light mode</span>
    </button>
  </header>

  <!-- Board — horizontally scrollable, columns centered when they fit -->
  <main class="flex-1 overflow-x-auto overflow-y-hidden">
    <div class="h-full flex justify-center p-5" style="min-width:max-content;">
      <div id="board" class="flex gap-4 h-full"></div>
    </div>
  </main>

  <!-- ── Add/Edit Task Modal ── -->
  <div id="task-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm">
    <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-2xl w-full max-w-md mx-4">
      <div class="flex items-center justify-between px-6 py-4 border-b border-slate-200 dark:border-slate-700">
        <h2 id="task-modal-title" class="font-semibold text-base">New Task</h2>
        <button onclick="closeTaskModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      <div class="px-6 py-5 space-y-4">
        <div>
          <label class="block text-sm text-slate-500 dark:text-slate-400 mb-1">Title <span class="text-red-500">*</span></label>
          <input id="task-title" type="text" placeholder="e.g. Migrate proxy service"
            class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-violet-500 placeholder-slate-400 dark:placeholder-slate-500 text-slate-900 dark:text-slate-100" />
        </div>
        <div>
          <label class="block text-sm text-slate-500 dark:text-slate-400 mb-1">Description</label>
          <textarea id="task-desc" rows="2" placeholder="Optional short note…"
            class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-violet-500 placeholder-slate-400 dark:placeholder-slate-500 resize-none text-slate-900 dark:text-slate-100"></textarea>
        </div>
        <div>
          <label class="block text-sm text-slate-500 dark:text-slate-400 mb-1">Project directory</label>
          <!-- Combo: dropdown of common dirs + free-text via datalist -->
          <input id="task-dir" type="text" list="dir-options" placeholder="Select or type a path…"
            class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-violet-500 placeholder-slate-400 dark:placeholder-slate-500 text-slate-900 dark:text-slate-100" />
          <datalist id="dir-options"></datalist>
        </div>
        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="text-sm text-slate-500 dark:text-slate-400">Claude Code plan <span class="text-slate-400 dark:text-slate-500 font-normal">(optional)</span></label>
            <button onclick="refreshPlans()" title="Refresh plan list"
              class="text-xs text-violet-500 hover:text-violet-700 dark:hover:text-violet-300 flex items-center gap-1">
              <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
              </svg>
              Refresh
            </button>
          </div>
          <select id="task-plan"
            class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-violet-500 text-slate-700 dark:text-slate-300">
            <option value="">— none —</option>
          </select>
          <p id="plans-status" class="text-xs text-slate-400 dark:text-slate-500 mt-1">Plans from <code class="text-slate-500 dark:text-slate-400">~/.claude/plans/</code></p>
        </div>
      </div>
      <div class="flex justify-end gap-2 px-6 py-4 border-t border-slate-200 dark:border-slate-700">
        <button onclick="closeTaskModal()" class="px-4 py-2 text-sm rounded-lg bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-300">Cancel</button>
        <button onclick="saveTask()" class="px-4 py-2 text-sm rounded-lg bg-violet-600 hover:bg-violet-500 text-white font-medium">Save task</button>
      </div>
    </div>
  </div>

  <!-- ── Plan Viewer Modal ── -->
  <div id="plan-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm">
    <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-2xl w-full max-w-3xl mx-4 flex flex-col" style="max-height:88vh;">
      <div class="flex items-center justify-between px-6 py-4 border-b border-slate-200 dark:border-slate-700 shrink-0">
        <div>
          <h2 id="plan-modal-title" class="font-semibold text-base"></h2>
          <p id="plan-modal-file" class="text-xs text-slate-400 dark:text-slate-500 font-mono mt-0.5"></p>
        </div>
        <button onclick="closePlanModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      <div id="plan-content" class="prose overflow-y-auto flex-1 px-6 py-5 text-sm"></div>
    </div>
  </div>

  <!-- ── Delete confirmation ── -->
  <div id="delete-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm">
    <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-2xl w-full max-w-sm mx-4">
      <div class="px-6 py-5">
        <h2 class="font-semibold mb-2">Delete task?</h2>
        <p class="text-sm text-slate-500 dark:text-slate-400">This can't be undone.</p>
      </div>
      <div class="flex justify-end gap-2 px-6 py-4 border-t border-slate-200 dark:border-slate-700">
        <button onclick="closeDeleteModal()" class="px-4 py-2 text-sm rounded-lg bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-300">Cancel</button>
        <button id="delete-confirm-btn" class="px-4 py-2 text-sm rounded-lg bg-red-600 hover:bg-red-500 text-white font-medium">Delete</button>
      </div>
    </div>
  </div>

  <script>
    // ── Config ───────────────────────────────────────────────────────────────
    const COLUMNS = [
      { id: 'todo',       label: 'Todo',        color: 'bg-slate-400 dark:bg-slate-500' },
      { id: 'inprogress', label: 'In Progress',  color: 'bg-blue-500'   },
      { id: 'testing',    label: 'Testing',      color: 'bg-amber-500'  },
      { id: 'done',       label: 'Done',         color: 'bg-emerald-500'},
      { id: 'archive',    label: 'Archive',      color: 'bg-slate-300 dark:bg-slate-600', collapsible: true },
    ];

    // Predefined project directories (edit to taste)
    const PROJECT_DIRS = [
      '/Users/joseph.brennan/code/platform/platform',
      '/Users/joseph.brennan/code/platform-workflow/platform',
      `${location.hostname === 'localhost' ? '' : ''}~/Documents`,
      '~/Code',
    ];

    // ── State ────────────────────────────────────────────────────────────────
    let tasks = [];
    let plans = [];
    let archiveExpanded = false;
    let editingTaskId = null;
    let editingColumn = null;
    let pendingDeleteId = null;
    let draggedId = null;

    // ── Theme ────────────────────────────────────────────────────────────────
    function isDark() { return document.documentElement.classList.contains('dark'); }

    function applyTheme(dark) {
      document.documentElement.classList.toggle('dark', dark);
      document.getElementById('hljs-dark').disabled  = !dark;
      document.getElementById('hljs-light').disabled = dark;
      document.getElementById('icon-sun').classList.toggle('hidden', !dark);
      document.getElementById('icon-moon').classList.toggle('hidden', dark);
      document.getElementById('theme-label').textContent = dark ? 'Light mode' : 'Dark mode';
      localStorage.setItem('theme', dark ? 'dark' : 'light');
    }

    function toggleTheme() { applyTheme(!isDark()); }

    // Restore saved preference (default: dark)
    const saved = localStorage.getItem('theme');
    applyTheme(saved ? saved === 'dark' : true);

    // ── Boot ─────────────────────────────────────────────────────────────────
    async function init() {
      populateDirOptions();
      [tasks, plans] = await Promise.all([fetchTasks(), fetchPlans()]);
      renderBoard();
    }

    async function fetchTasks() {
      try { const r = await fetch('/api/tasks'); return r.ok ? r.json() : []; }
      catch { return []; }
    }

    async function fetchPlans() {
      try {
        const r = await fetch('/api/plans');
        if (!r.ok) return [];
        const list = await r.json();
        return list;
      } catch { return []; }
    }

    async function refreshPlans() {
      const currentSelected = document.getElementById('task-plan').value;
      const btn = document.querySelector('[onclick="refreshPlans()"]');
      btn.classList.add('opacity-50');
      plans = await fetchPlans();
      populatePlanSelect(currentSelected);
      btn.classList.remove('opacity-50');
    }

    async function saveTasks() {
      await fetch('/api/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(tasks),
      });
    }

    // ── Datalist for directories ─────────────────────────────────────────────
    function populateDirOptions() {
      const dl = document.getElementById('dir-options');
      dl.innerHTML = '';
      PROJECT_DIRS.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d;
        dl.appendChild(opt);
      });
    }

    // ── Render ───────────────────────────────────────────────────────────────
    function renderBoard() {
      const board = document.getElementById('board');
      board.innerHTML = '';
      COLUMNS.forEach(col => board.appendChild(buildColumn(col)));
    }

    function buildColumn(col) {
      const colTasks = tasks.filter(t => t.column === col.id);
      const isCollapsible = !!col.collapsible;
      const expanded = isCollapsible ? archiveExpanded : true;

      const wrap = document.createElement('div');
      wrap.className = 'flex flex-col w-72 shrink-0 h-full';

      const cardsHtml = colTasks.map(t => cardHTML(t)).join('');

      wrap.innerHTML = `
        <div class="flex items-center gap-2 mb-3 px-1">
          <span class="w-2.5 h-2.5 rounded-full ${col.color}"></span>
          <span class="font-semibold text-sm tracking-wide uppercase text-slate-600 dark:text-slate-300">${col.label}</span>
          <span class="ml-auto text-xs bg-slate-200 text-slate-600 dark:bg-slate-700 dark:text-slate-400 rounded-full px-2 py-0.5 font-mono">${colTasks.length}</span>
          ${isCollapsible ? `
          <button onclick="toggleArchive()" title="${expanded ? 'Hide' : 'Show'} tasks"
            class="p-1 rounded text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors ml-1">
            <svg class="w-4 h-4 transition-transform ${expanded ? '' : '-rotate-90'}" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
            </svg>
          </button>` : ''}
        </div>
        <div id="col-${col.id}"
          class="flex-1 overflow-y-auto space-y-2 col-drop-target rounded-xl p-2
                 bg-slate-100/80 dark:bg-slate-800/50 ${isCollapsible && !expanded ? 'hidden' : ''}"
          ondragover="onDragOver(event, '${col.id}')"
          ondragleave="onDragLeave(event)"
          ondrop="onDrop(event, '${col.id}')">
          ${cardsHtml}
        </div>
        <button onclick="openAddModal('${col.id}')"
          class="mt-2 flex items-center gap-1.5 px-3 py-2 text-sm
                 text-slate-400 hover:text-slate-600 hover:bg-slate-100
                 dark:text-slate-500 dark:hover:text-slate-300 dark:hover:bg-slate-800
                 rounded-lg transition-colors ${isCollapsible && !expanded ? 'hidden' : ''}">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
          </svg>
          Add task
        </button>
      `;
      return wrap;
    }

    function toggleArchive() {
      archiveExpanded = !archiveExpanded;
      renderBoard();
    }

    function cardHTML(task) {
      const hasPlan = !!task.planFile;
      const hasDir  = !!task.projectDir;
      const dirDisplay = task.projectDir ? task.projectDir.replace(/^.*\//, '') || task.projectDir : '';
      return `
        <div id="card-${task.id}"
          class="card bg-white dark:bg-slate-700/60
                 border border-slate-200 dark:border-slate-600/50
                 hover:border-slate-300 dark:hover:border-slate-500
                 rounded-lg px-3 py-2.5 transition-colors select-none"
          draggable="true"
          ondragstart="onDragStart(event, '${task.id}')"
          ondragend="onDragEnd(event)">
          <div class="flex items-start gap-2">
            <div class="flex-1 min-w-0" onclick="onCardClick('${task.id}')">
              <p class="text-sm font-medium text-slate-800 dark:text-slate-100 truncate">${escHtml(task.title)}</p>
              ${task.description ? `<p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5 line-clamp-2">${escHtml(task.description)}</p>` : ''}
              ${hasDir ? `<p class="text-xs text-slate-400 dark:text-slate-500 font-mono mt-1 truncate">📁 ${escHtml(dirDisplay)}</p>` : ''}
            </div>
            <div class="flex items-center gap-1 shrink-0 ml-1">
              ${hasPlan ? `
              <button title="View plan" onclick="openPlan('${task.id}')"
                class="p-1 rounded text-slate-400 hover:text-violet-600 dark:hover:text-violet-400 hover:bg-slate-100 dark:hover:bg-slate-600 transition-colors">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
              </button>` : ''}
              ${hasDir ? `
              <button title="Open in Claude Code" onclick="openTerminal('${task.id}')"
                class="p-1 rounded text-slate-400 hover:text-emerald-600 dark:hover:text-emerald-400 hover:bg-slate-100 dark:hover:bg-slate-600 transition-colors">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
              </button>` : ''}
              <button title="Edit task" onclick="openEditModal('${task.id}')"
                class="p-1 rounded text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-600 transition-colors">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                </svg>
              </button>
              <button title="Delete task" onclick="confirmDelete('${task.id}')"
                class="p-1 rounded text-slate-400 hover:text-red-500 dark:hover:text-red-400 hover:bg-slate-100 dark:hover:bg-slate-600 transition-colors">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
              </button>
            </div>
          </div>
        </div>
      `;
    }

    // ── Plan select ──────────────────────────────────────────────────────────
    function populatePlanSelect(selected = '') {
      const sel = document.getElementById('task-plan');
      const status = document.getElementById('plans-status');
      sel.innerHTML = '<option value="">— none —</option>';
      plans.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p;
        opt.textContent = p;
        if (p === selected) opt.selected = true;
        sel.appendChild(opt);
      });
      if (plans.length === 0) {
        status.textContent = 'No plans found — is the server running?';
        status.classList.add('text-amber-500');
        status.classList.remove('text-slate-400', 'dark:text-slate-500');
      } else {
        status.textContent = `${plans.length} plan${plans.length !== 1 ? 's' : ''} from ~/.claude/plans/`;
        status.classList.remove('text-amber-500');
        status.classList.add('text-slate-400');
      }
    }

    // ── Task modal ───────────────────────────────────────────────────────────
    async function openAddModal(colId) {
      editingTaskId = null;
      editingColumn = colId;
      document.getElementById('task-modal-title').textContent = 'New Task';
      document.getElementById('task-title').value = '';
      document.getElementById('task-desc').value = '';
      document.getElementById('task-dir').value = '';
      // Always fetch fresh plans when opening modal
      plans = await fetchPlans();
      populatePlanSelect('');
      document.getElementById('task-modal').classList.remove('hidden');
      document.getElementById('task-title').focus();
    }

    async function openEditModal(taskId) {
      const task = tasks.find(t => t.id === taskId);
      if (!task) return;
      editingTaskId = taskId;
      editingColumn = task.column;
      document.getElementById('task-modal-title').textContent = 'Edit Task';
      document.getElementById('task-title').value = task.title;
      document.getElementById('task-desc').value = task.description || '';
      document.getElementById('task-dir').value = task.projectDir || '';
      plans = await fetchPlans();
      populatePlanSelect(task.planFile || '');
      document.getElementById('task-modal').classList.remove('hidden');
      document.getElementById('task-title').focus();
    }

    function closeTaskModal() {
      document.getElementById('task-modal').classList.add('hidden');
    }

    async function saveTask() {
      const title = document.getElementById('task-title').value.trim();
      if (!title) { document.getElementById('task-title').focus(); return; }
      const description = document.getElementById('task-desc').value.trim();
      const projectDir  = document.getElementById('task-dir').value.trim();
      const planFile    = document.getElementById('task-plan').value;

      if (editingTaskId) {
        Object.assign(tasks.find(t => t.id === editingTaskId), { title, description, projectDir, planFile });
      } else {
        tasks.push({ id: crypto.randomUUID(), title, description, column: editingColumn, projectDir, planFile, createdAt: new Date().toISOString() });
      }

      await saveTasks();
      closeTaskModal();
      renderBoard();
    }

    // ── Plan modal ───────────────────────────────────────────────────────────
    async function openPlan(taskId) {
      const task = tasks.find(t => t.id === taskId);
      if (!task?.planFile) return;

      document.getElementById('plan-modal-title').textContent = task.title;
      document.getElementById('plan-modal-file').textContent = task.planFile;
      document.getElementById('plan-content').innerHTML = '<p class="text-slate-400 text-sm">Loading…</p>';
      document.getElementById('plan-modal').classList.remove('hidden');

      try {
        const r = await fetch(`/api/plan?file=${encodeURIComponent(task.planFile)}`);
        if (!r.ok) {
          const body = await r.json().catch(() => ({}));
          throw new Error(body.error || `HTTP ${r.status}`);
        }
        const { content } = await r.json();
        document.getElementById('plan-content').innerHTML = marked.parse(content);
        document.querySelectorAll('#plan-content pre code').forEach(el => hljs.highlightElement(el));
      } catch (err) {
        document.getElementById('plan-content').innerHTML =
          `<p class="text-red-500 text-sm">Could not load plan: ${escHtml(err.message)}</p>`;
      }
    }

    function onCardClick(taskId) {
      const task = tasks.find(t => t.id === taskId);
      task?.planFile ? openPlan(taskId) : openEditModal(taskId);
    }

    function closePlanModal() {
      document.getElementById('plan-modal').classList.add('hidden');
    }

    // ── Terminal ─────────────────────────────────────────────────────────────
    async function openTerminal(taskId) {
      const task = tasks.find(t => t.id === taskId);
      if (!task?.projectDir) return;
      try {
        const r = await fetch('/api/open-terminal', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ dir: task.projectDir }),
        });
        if (!r.ok) { const { error } = await r.json(); alert(`Could not open terminal: ${error}`); }
      } catch { alert('Server unreachable.'); }
    }

    // ── Delete ───────────────────────────────────────────────────────────────
    function confirmDelete(taskId) {
      pendingDeleteId = taskId;
      document.getElementById('delete-modal').classList.remove('hidden');
      document.getElementById('delete-confirm-btn').onclick = async () => {
        tasks = tasks.filter(t => t.id !== pendingDeleteId);
        await saveTasks();
        closeDeleteModal();
        renderBoard();
      };
    }

    function closeDeleteModal() {
      document.getElementById('delete-modal').classList.add('hidden');
      pendingDeleteId = null;
    }

    // ── Drag and drop ────────────────────────────────────────────────────────
    function onDragStart(event, taskId) {
      draggedId = taskId;
      event.dataTransfer.effectAllowed = 'move';
      setTimeout(() => document.getElementById(`card-${taskId}`)?.classList.add('dragging'), 0);
    }

    function onDragEnd() {
      document.getElementById(`card-${draggedId}`)?.classList.remove('dragging');
      document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
    }

    function onDragOver(event, colId) {
      event.preventDefault();
      event.dataTransfer.dropEffect = 'move';
      document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
      document.getElementById(`col-${colId}`)?.classList.add('drag-over');
    }

    function onDragLeave(event) {
      if (!event.currentTarget.contains(event.relatedTarget))
        event.currentTarget.classList.remove('drag-over');
    }

    async function onDrop(event, colId) {
      event.preventDefault();
      document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
      if (!draggedId) return;
      const task = tasks.find(t => t.id === draggedId);
      if (task && task.column !== colId) { task.column = colId; await saveTasks(); renderBoard(); }
      draggedId = null;
    }

    // ── Keyboard shortcuts ───────────────────────────────────────────────────
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') { closeTaskModal(); closePlanModal(); closeDeleteModal(); }
    });
    document.getElementById('task-title').addEventListener('keydown', e => {
      if (e.key === 'Enter') saveTask();
    });

    // ── Helpers ──────────────────────────────────────────────────────────────
    function escHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    init();
  </script>
</body>
</html>
